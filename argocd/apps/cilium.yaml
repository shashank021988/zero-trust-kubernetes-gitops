apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.15.1
    helm:
      values: |
        kubeProxyReplacement: strict
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
        encryption:
          enabled: true
          type: wireguard
        endpointRoutes:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
